aid: backpack-healthcare
name: Backpack Healthcare
description: Backpack Healthcare is a virtual (telehealth) pediatric and family mental
  health provider delivering therapy, psychiatry, and medication management for children,
  tweens, teens, young adults, and adults. It offers age-based care (Littles 4-10,
  Tweens & Teens 11-17, Young Adults 18+, and Adults) across concerns including ADHD,
  anxiety, autism spectrum disorder, depression, OCD, maternal mental health, and substance
  use, alongside a consumer Self Care / Care Companion mobile app. Backpack partners
  with health plans, schools, health systems, and community and government agencies
  to expand access to youth behavioral health, and is a Techstars portfolio company.
  It currently exposes no public developer API surface.
